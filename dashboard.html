<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/styles.css">

  <div class="navbar">
    <span id="welcomeText">Cargando...</span>
    <button onclick="logout()">Cerrar sesión</button>
  </div>

  <div class="menu">

    <div class="card" onclick="location.href='report.html'">
      📦 Registrar Insumo
    </div>

    <div id="adminCard" class="card hidden" onclick="location.href='approve.html'">
      ⚖️ Aprobaciones (Admin)
    </div>

    <div class="card" onclick="location.href='history.html'">
      📋 Historial
    </div>

  </div>

  <!-- 🔥 SCRIPT AQUÍ ABAJO -->
  <script type="module">
    import { auth, db } from "./firebase.js";
    import { doc, getDoc } 
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    document.addEventListener("DOMContentLoaded", () => {

      const welcome = document.getElementById("welcomeText");
      const adminCard = document.getElementById("adminCard");

      if (!welcome || !adminCard) {
        console.error("Elementos no encontrados");
        return;
      }

      auth.onAuthStateChanged(async (user) => {

        if (!user) {
          window.location.href = "index.html";
          return;
        }

        try {
          const ref = doc(db, "users", user.uid);
          const snap = await getDoc(ref);

          if (!snap.exists()) {
            welcome.innerText = `Hola, ${user.email} (sin rol)`;
            return;
          }

          const data = snap.data();

          welcome.innerText = `Hola, ${data.email} (${data.role})`;

          if (data.role === "admin") {
            adminCard.classList.remove("hidden");
          }

        } catch (err) {
          console.error(err);
        }

      });

    });

    window.logout = async function () {
      await auth.signOut();
      window.location.href = "index.html";
    };
  </script>

</body>
</html>
