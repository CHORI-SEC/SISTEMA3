<script type="module">
import { auth, db } from "./firebase.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

document.addEventListener("DOMContentLoaded", () => {

  const welcome = document.getElementById("welcomeText");
  const adminCard = document.getElementById("adminCard");

  // Validación defensiva (evita tu error actual)
  if (!welcome || !adminCard) {
    console.error("Elementos del DOM no encontrados");
    return;
  }

  // 🔐 Estado de autenticación
  auth.onAuthStateChanged(async (user) => {

    if (!user) {
      window.location.href = "index.html";
      return;
    }

    try {
      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);

      // ⚠️ Usuario no existe en Firestore
      if (!userSnap.exists()) {
        console.warn("Usuario sin documento en Firestore");

        welcome.innerText = `Hola, ${user.email} (sin rol)`;
        return;
      }

      const data = userSnap.data();

      // 🧠 fallback por si falta algo en DB
      const role = data.role || "sin rol";
      const email = data.email || user.email;

      welcome.innerText = `Hola, ${email} (${role})`;

      // 🔑 Control de acceso
      if (role === "admin") {
        adminCard.classList.remove("hidden");
        adminCard.style.display = "flex";
      } else {
        adminCard.style.display = "none";
      }

    } catch (error) {
      console.error("Error Firebase:", error);
      alert("Error cargando datos del usuario");
    }

  });

});

// 🚪 Logout limpio
window.logout = async function() {
  try {
    await auth.signOut();
    window.location.href = "index.html";
  } catch (error) {
    console.error("Error al cerrar sesión:", error);
  }
};
</script>
