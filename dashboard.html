<script type="module">
import { auth, db } from "./firebase.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

document.addEventListener("DOMContentLoaded", () => {

  const welcome = document.getElementById("welcomeText");
  const adminCard = document.getElementById("adminCard");

  // 🔐 Verificar usuario autenticado
  auth.onAuthStateChanged(async (user) => {

    if (!user) {
      window.location.href = "index.html";
      return;
    }

    try {
      // 🔥 Obtener rol desde Firestore
      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);

      if (!userSnap.exists()) {
        alert("Usuario sin rol asignado");
        return;
      }

      const data = userSnap.data();

      // 👤 Mostrar info
      if (welcome) {
        welcome.innerText = `Hola, ${data.email} (${data.role})`;
      }

      // 🔑 Mostrar panel admin solo si corresponde
      if (data.role === "admin" && adminCard) {
        adminCard.classList.remove("hidden");
        adminCard.style.display = "flex";
      }

    } catch (error) {
      console.error(error);
      alert("Error cargando usuario");
    }

  });

});

// 🚪 Logout GLOBAL (fuera del DOMContentLoaded)
window.logout = function() {
  auth.signOut().then(() => {
    window.location.href = "index.html";
  });
};
</script>
