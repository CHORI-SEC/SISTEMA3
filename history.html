<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historial</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

  <div class="navbar">
    <span id="title">Historial</span>
    <button onclick="logout()">Cerrar sesión</button>
  </div>

  <div class="container">
    <div id="list"></div>
  </div>

  <script type="module">

    import { auth, db } from "./firebase.js";

    import {
      collection,
      getDocs,
      query,
      where,
      orderBy,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const list = document.getElementById("list");
    const title = document.getElementById("title");

    auth.onAuthStateChanged(async (user) => {

      if (!user) {
        window.location.href = "index.html";
        return;
      }

      try {

        // Buscar rol
        let role = "user";

        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
          role = userSnap.data().role || "user";
        }

        let q;

        // ADMIN
        if (role === "admin") {

          title.innerText = "Historial (Admin)";

          q = query(
            collection(db, "items"),
            orderBy("created at", "desc")
          );

        } else {

          // USER NORMAL
          title.innerText = "Mis pedidos";

          q = query(
            collection(db, "items"),
            where("userId", "==", user.uid),
            orderBy("created at", "desc")
          );
        }

        const snapshot = await getDocs(q);

        console.log(
          "Pedidos:",
          snapshot.docs.map(d => d.data())
        );

        if (snapshot.empty) {
          list.innerHTML = "<p>No hay pedidos</p>";
          return;
        }

        list.innerHTML = "";

        snapshot.forEach((docSnap) => {

          const data = docSnap.data();

          const div = document.createElement("div");
          div.className = "card";

          let color = "#999";

          if (data.status === "aprobado") {
            color = "green";
          }

          if (data.status === "rechazado") {
            color = "red";
          }

          let fecha = "Sin fecha";

          if (data["created at"]?.toDate) {
            fecha = data["created at"]
              .toDate()
              .toLocaleString();
          }

          div.innerHTML = `
            <h3>${data.name || "Sin nombre"}</h3>

            <p><strong>Cantidad:</strong> ${data.qty || 0}</p>

            <p><strong>Motivo:</strong> ${data.reason || "Sin motivo"}</p>

            <p><strong>Fecha:</strong> ${fecha}</p>

            <p style="color:${color}; font-weight:bold;">
              Estado: ${data.status || "pendiente"}
            </p>
          `;

          list.appendChild(div);

        });

      } catch (error) {

        console.error(error);

        list.innerHTML = `
          <p>Error cargando historial</p>
          <p>${error.message}</p>
        `;
      }

    });

    window.logout = async function () {
      await auth.signOut();
      window.location.href = "index.html";
    };

  </script>

</body>
</html>
