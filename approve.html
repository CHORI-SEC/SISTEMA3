<script type="module">
import { auth, db } from "./firebase.js";
import { 
  collection, getDocs, updateDoc, doc 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// 🔐 Verificar usuario y rol
auth.onAuthStateChanged(async (user) => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  // 🔥 Verificar rol en Firestore
  const userRef = doc(db, "users", user.uid);
  const userSnap = await getDocs(collection(db, "users"));

  let isAdmin = false;

  userSnap.forEach(docu => {
    if (docu.id === user.uid && docu.data().role === "admin") {
      isAdmin = true;
    }
  });

  if (!isAdmin) {
    alert("Acceso denegado");
    window.location.href = "dashboard.html";
    return;
  }

  // ✅ Si es admin → cargar pedidos
  loadPending();

});

// 🔥 Cargar pedidos desde Firestore
async function loadPending() {
  const listContainer = document.getElementById("pendingList");
  listContainer.innerHTML = "";

  const querySnapshot = await getDocs(collection(db, "items"));

  let hasItems = false;

  querySnapshot.forEach(docSnap => {
    const item = docSnap.data();

    if (item.status === "pendiente") {
      hasItems = true;

      const card = document.createElement("div");
      card.className = "card-item";

      card.innerHTML = `
        <div class="card-content">
          <b>📦 ${item.name}</b>
          <p>Cantidad: ${item.qty}</p>
          <p><small>${item.userEmail || ""}</small></p>
          <p><i>${item.reason}</i></p>
        </div>
        <div class="card-actions">
          <button class="btn-approve" data-id="${docSnap.id}" data-status="aprobado">Aprobar</button>
          <button class="btn-reject" data-id="${docSnap.id}" data-status="rechazado">Rechazar</button>
        </div>
      `;

      listContainer.appendChild(card);
    }
  });

  if (!hasItems) {
    listContainer.innerHTML = '<p class="empty-state">No hay solicitudes esperando aprobación.</p>';
  }

  // 🎯 Eventos botones
  document.querySelectorAll(".btn-approve, .btn-reject").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      const id = e.target.dataset.id;
      const status = e.target.dataset.status;

      await updateStatus(id, status);
    });
  });
}

// 🔥 Actualizar estado en Firestore
async function updateStatus(id, newStatus) {
  try {
    const itemRef = doc(db, "items", id);

    await updateDoc(itemRef, {
      status: newStatus,
      reviewedAt: new Date().toISOString()
    });

    alert("Registro " + newStatus);

    loadPending(); // refrescar

  } catch (error) {
    console.error(error);
    alert("Error al actualizar");
  }
}
</script>
